name: Live tests

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to test
        required: false
        type: string
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: live-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    name: Live suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The setup and stop scripts run as root against code from the checked-out
    # ref. Fork PRs must not get that: GitHub uses this workflow from the base
    # branch for fork pull requests, so this gate cannot be removed by the PR.
    # Same-repo PRs, pushes, scheduled runs, manual runs, and workflow_call
    # from the publish tag all still run the live suite.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install
        run: npm ci

      # The private key is gitignored, so each run gets a throwaway pair. The
      # setup script installs the public half for the test users.
      - name: Generate throwaway SSH key
        run: ssh-keygen -q -t ed25519 -N "" -C ssh2shell-ci -f "$RUNNER_TEMP/test_ed25519"

      - name: Start test hosts
        run: sudo bash test/ci/setup-live-hosts.sh "$RUNNER_TEMP/test_ed25519.pub"

      # The runner image runs its own sshd on 0.0.0.0:22, so the test hosts use
      # 2222 (the setup script's default). Keep these in sync with
      # test/ci/setup-live-hosts.sh if LIVE_SSH_PORT is changed.
      - name: Run live suite
        env:
          SSH2SHELL_MODULE: src
          HOST: 127.0.0.10
          PORT: '2222'
          USER_NAME: tester
          PASSWORD: password
          PRIVATE_KEY_PATH: ${{ runner.temp }}/test_ed25519
          KEY_PASSPHRASE: ''
          EXPECTED_HOST_HASH: ''
          SECOND_USER: suuser
          SECOND_USER_PASSWORD: secondpassword
          NOPASSWD_USER: nopasswd
          NOPASSWD_PASSWORD: nopasswdpassword
          KBD_USER: kbduser
          KBD_PASSWORD: kbdpassword
          KBD_HOST: 127.0.0.10
          KBD_PORT: '2222'
          SERVER1_HOST: 127.0.0.10
          SERVER1_PORT: '2222'
          SERVER1_USER_NAME: tester
          SERVER1_PASSWORD: password
          SERVER2_HOST: 127.0.0.11
          SERVER2_PORT: '2222'
          SERVER2_USER_NAME: tester
          SERVER2_PASSWORD: password
          SERVER3_HOST: 127.0.0.12
          SERVER3_PORT: '2222'
          SERVER3_USER_NAME: tester
          SERVER3_PASSWORD: password
        run: npm run test:live:all

      # sshd logs are root-owned, and upload-artifact runs as the runner user.
      # Copy them into the workspace so the artifact has one readable root.
      - name: Collect live logs
        if: always()
        run: |
          mkdir -p test/logs/sshd
          sudo cp /var/log/ssh2shell/*.log test/logs/sshd/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" test/logs

      - name: Upload live logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-logs
          path: test/logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop test hosts
        if: always()
        run: sudo bash test/ci/stop-live-hosts.sh
